<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { margin-bottom: 20px; }
        .company-name { font-size: 24px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="header">
    <div class="company-name">THREE THREADS</div>
    <p>Try it, wear it, love it.</p>
</div>

<div>
    <!-- Handle potential null fields safely using Thymeleaf null checks -->
    <p><strong>Billed To:</strong> <span th:text="${order.customerName != null ? order.customerName : 'N/A'}">Customer</span></p>
    <p><strong>Invoice ID:</strong> #INV-<span th:text="${order.id}">2</span></p>
    <p><strong>Status:</strong> <span th:text="${order.status}">PENDING</span></p>
    <p><strong>Grand Total:</strong> ₹<span th:text="${totalAmount}">0</span></p>
</div>

<table>
    <thead>
    <tr>
        <th>ARTICLE NO</th>
        <th>COLOR</th>
        <th>SETS/LOOSE</th>
        <th>PRICE/PC</th>
        <th>TOTAL</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterate over order items list -->
    <tr th:each="item : ${items}">
        <th th:text="${item.articleNo}">ART-101</th>
        <td th:text="${item.color}">Black</td>
        <td th:text="${item.quantity}">1 Set</td>
        <td th:text="${'₹' + item.pricePerPc}">₹500</td>
        <td th:text="${'₹' + item.totalPrice}">₹500</td>
    </tr>
    </tbody>
</table>

</body>
</html>
