<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
        body { font-family: Arial, sans-serif; margin: 20px; color: #333; }
        .header { margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .company-name { font-size: 24px; font-weight: bold; }
        .details { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

<div class="header">
    <div class="company-name">THREE THREADS</div>
    <p>Try it, wear it, love it.</p>
</div>

<div class="details">
    <p><strong>Billed To:</strong> <span th:text="${order?.customerName != null ? order.customerName : 'N/A'}">Customer</span></p>
    <p><strong>Invoice No:</strong> <span th:text="${order?.invoiceNo != null ? order.invoiceNo : 'N/A'}">INV-0000</span></p>
    <p><strong>Status:</strong> <span th:text="${order?.status != null ? order.status : 'PENDING'}">PENDING</span></p>
    <p><strong>Grand Total:</strong> ₹<span th:text="${totalAmount != null ? totalAmount : 0}">0</span></p>
</div>

<table>
    <thead>
    <tr>
        <th>ARTICLE NO</th>
        <th>COLOR</th>
        <th>TOTAL PCS</th>
        <th>PRICE/PC</th>
        <th>TOTAL</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item?.articleNo != null ? item.articleNo : 'N/A'}">ART-101</td>
        <td th:text="${item?.colorName != null ? item.colorName : 'N/A'}">Black</td>
        <td th:text="${item?.totalPiecesOrdered != null ? item.totalPiecesOrdered : 0}">1</td>
        <td th:text="${item?.pricePerPiece != null ? '₹' + item.pricePerPiece : '₹0'}">₹0</td>
        <td th:text="${item?.itemTotal != null ? '₹' + item.itemTotal : '₹0'}">₹0</td>
    </tr>
    </tbody>
</table>

</body>
</html>
