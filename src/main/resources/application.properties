spring.application.name=ThreeThreadsMvp
# Dyno/Render Port Binding
# Dynamic Port for Render
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Config (Neon PostgreSQL)
# Pass the full Neon connection string as an environment variable in Render, or fall back to local/default
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Increase Spring MVC / Multipart upload caps
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Server Tomcat Max Post Size (for raw JSON strings containing large Base64 photos)
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB